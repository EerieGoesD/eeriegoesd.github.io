<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Clock Yard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Until the app is bought, the one place to buy it (free_trial_model.txt). -->
      <div class="trial-bar" id="trialBar" hidden>
        <span class="trial-text" id="trialText"></span>
        <button class="btn btn-accent" id="trialBuy" type="button"></button>
      </div>

      <!-- Boards live in a sidebar. On Mac and iPad it sits beside the deck and
           folds away with the sidebar button. On iPhone it slides in over the
           deck from the left: the sidebar button or a swipe right from the left
           edge opens it; a swipe left, a tap outside or picking a board closes it. -->
      <div class="shell">
      <div class="drawer-scrim" id="drawerScrim" hidden></div>
      <aside class="sidebar" id="sidebar" aria-label="Boards">
        <div class="side-title">Boards</div>
        <nav class="board-list" id="boardList"></nav>
        <button class="side-add" id="sideAdd" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <span>New Board</span>
        </button>
      </aside>

      <!-- The header sticks to the top of the scrolling deck, so the deck
           starts right under it and scrolls beneath it. The board's name is the
           title. The controls float on the right in glass groups, with New Timer
           on its own, tinted. -->
      <main class="content" id="content">
      <header class="header" id="header">
        <div class="header-in">
        <button id="sideToggle" class="round-btn glass side-toggle" type="button" title="Boards" aria-label="Boards" aria-controls="sidebar">
          <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="15" rx="3" /><path d="M9.5 4.5v15" />
          </svg>
        </button>
        <div class="tb-title">
          <h1 class="board-name" id="boardName"></h1>
          <div class="board-meta" id="boardMeta"></div>
        </div>
        <div class="tb-view">
          <div class="seg glass" id="viewSeg" role="group" aria-label="View">
            <button type="button" data-view="list" aria-label="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <span>List</span>
            </button>
            <button type="button" data-view="grid" aria-label="Grid view">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="7" cy="7" r="3.5" /><circle cx="17" cy="7" r="3.5" /><circle cx="7" cy="17" r="3.5" /><circle cx="17" cy="17" r="3.5" />
              </svg>
              <span>Grid</span>
            </button>
          </div>
          <select id="sortSelect" class="glass" aria-label="Sort">
            <option value="name">Name (A-Z)</option>
            <option value="remaining">Time remaining</option>
          </select>
        </div>
        <div class="header-actions">
          <div class="tool-group glass">
          <button id="searchBtn" class="round-btn" type="button" title="Search" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" />
            </svg>
          </button>
          <button id="themeToggle" class="round-btn" type="button" aria-label="Switch theme"></button>
          <button id="settingsBtn" class="round-btn" type="button" title="Settings" aria-label="Settings">
            <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          </div>
          <button id="addBtn" class="round-btn add-btn desktop-only" type="button" title="New timer" aria-label="New timer">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        </div>
      </header>

        <div class="error-strip" id="errorStrip" role="alert" hidden>
          <span id="errorText"></span>
          <button class="error-close" id="errorClose" type="button" aria-label="Dismiss">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="deck" id="deck"></div>
      </main>
      </div>

      <!-- Zero-height line above the footer: the add button, notes and alarms
           hang off it, so they clear the footer at any height. -->
      <div class="float-anchor">
        <button class="fab ios-only" id="fab" type="button" aria-label="New timer">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
          </svg>
        </button>
        <div class="snack" id="snack" hidden></div>
      </div>

      <footer class="footer" id="footer">
        <div class="brand-sub" id="brandSub"></div>
        <div class="footer-links" id="footerLinks">
          <a href="#" class="flink flink-eerie" data-url="https://eeriegoesd.com">Made by EERIE</a>
          <a href="#" class="flink not-ios" data-url="https://support.eeriegoesd.com/report-issue/clock-yard">Report Issue</a>
          <a href="#" class="flink not-ios" data-url="https://support.eeriegoesd.com/community/clock-yard">Discussions</a>
          <a href="#" class="flink not-ios" data-url="https://support.eeriegoesd.com/suggest-feature/clock-yard">Feature Request</a>
          <!-- Windows only. Guideline 3.1.1 bans links to outside payment from an
               App Store build, so main.js drops this one on Apple devices. -->
          <a href="#" class="flink flink-coffee" id="coffeeLink" data-url="https://buymeacoffee.com/eeriegoesd">&#9749; Support This Project</a>
        </div>
      </footer>
    </div>

    <!-- Alarms that are ringing sit over everything but the purchase page. -->
    <div class="ringers" id="ringers"></div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="overlay dialog-overlay" id="dialogOverlay" hidden>
      <div class="sheet dialog" id="dialog" role="alertdialog" aria-modal="true"></div>
    </div>

    <div class="buy-page" id="buyPage" role="dialog" aria-modal="true" hidden></div>

    <script src="engine.js"></script>
    <script src="main.js"></script>
  </body>
</html>

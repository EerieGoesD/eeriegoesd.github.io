<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bear in Mind</title>
    <meta
      name="description"
      content="A list for the things you are afraid of forgetting. Type one in, press Enter, tick it off. Your list is saved in your own browser and never leaves it."
    />
    <link rel="icon" href="icon-128.png" />
    <link rel="canonical" href="https://eeriegoesd.com/bear-in-mind/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bear in Mind" />
    <meta
      property="og:description"
      content="A list for the things you are afraid of forgetting. Type one in, press Enter, tick it off. Your list is saved in your own browser and never leaves it."
    />
    <meta property="og:url" content="https://eeriegoesd.com/bear-in-mind/" />
    <link rel="stylesheet" href="app.css" />

    <script>
      // Analytics, same account and same rules as the rest of eeriegoesd.com:
      // nothing is stored until the visitor accepts the banner, and the choice
      // is remembered site-wide, so anyone who already answered on another page
      // is not asked again here.
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.gtag = gtag;
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500,
      });

      function initGtag() {
        if (document.getElementById("gtag-script")) return;
        var s = document.createElement("script");
        s.id = "gtag-script";
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-K00TNSHNQ2";
        document.head.appendChild(s);
        gtag("consent", "update", { analytics_storage: "granted" });
        gtag("js", new Date());
        gtag("config", "G-K00TNSHNQ2");
      }

      function hideBanner() {
        document.getElementById("cookieBanner").style.display = "none";
      }

      function acceptCookies() {
        localStorage.setItem("cookie-consent", "accepted");
        hideBanner();
        initGtag();
      }

      function rejectCookies() {
        localStorage.setItem("cookie-consent", "rejected");
        hideBanner();
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <div class="brand-row">
            <div class="brand-mark" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <circle cx="5.6" cy="6.2" r="3" fill="currentColor" />
                <circle cx="18.4" cy="6.2" r="3" fill="currentColor" />
                <circle cx="12" cy="13.4" r="8" fill="currentColor" />
                <ellipse cx="12" cy="16.6" rx="3.6" ry="2.8" fill="var(--panel)" />
                <ellipse cx="12" cy="15.2" rx="1.5" ry="1.1" fill="currentColor" />
                <circle cx="8.9" cy="11.4" r="1.15" fill="var(--panel)" />
                <circle cx="15.1" cy="11.4" r="1.15" fill="var(--panel)" />
              </svg>
            </div>
            <div class="brand-title">Bear in Mind</div>
            <button
              id="themeToggle"
              class="theme-toggle"
              title="Switch to light theme"
              aria-label="Switch theme"
            ></button>
          </div>
          <div class="brand-sub" id="brandSub"></div>
        </div>

        <div class="brand-progress" id="brandProgress">
          <span class="bar"><span class="bar-fill" id="brandBarFill"></span></span>
          <strong class="pct" id="brandPct">0%</strong>
        </div>

        <div class="header-spacer"></div>

        <div class="header-actions">
          <button id="menuButton" class="icon-btn menu-btn" title="Settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="2.2" fill="currentColor" />
              <circle cx="12" cy="12" r="2.2" fill="currentColor" />
              <circle cx="19" cy="12" r="2.2" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <div class="capture" id="capture">
        <div class="capture-row">
          <input
            id="captureInput"
            class="capture-input"
            type="text"
            maxlength="500"
            autocomplete="off"
            spellcheck="false"
            placeholder="What do you need to bear in mind?"
          />
          <button id="addButton" class="icon-btn add-btn" title="Add" aria-label="Add">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <textarea
          id="captureDetails"
          class="capture-details"
          rows="3"
          maxlength="2000"
          spellcheck="false"
          placeholder="Anything else worth remembering about it (optional)"
        ></textarea>
      </div>

      <div class="problem" id="problem" hidden></div>

      <div class="list" id="list"></div>

      <footer class="footer">
        <div class="footer-links">
          <a id="linkCoffee" class="flink" href="#">Support This Project</a>
          <span class="sep">|</span>
          <span class="made">Made by</span>
          <a id="linkEerie" class="flink" href="#">EERIE</a>
          <span class="sep">|</span>
          <a id="linkReport" class="flink" href="#">Report Issue</a>
          <span class="sep">|</span>
          <a id="linkFeedback" class="flink" href="#">Discussions</a>
          <span class="sep">|</span>
          <a id="linkFeature" class="flink" href="#">Feature Request</a>
        </div>
      </footer>

      <div class="menu-panel" id="menuPanel" hidden>
        <label class="menu-row">
          <input type="checkbox" class="tick" id="chkProgress" />
          <span>Show overall progress</span>
        </label>
        <label class="menu-row">
          <input type="checkbox" class="tick" id="chkMetrics" />
          <span>Show storage used</span>
        </label>
        <div class="menu-sep"></div>
        <button class="menu-action" id="btnImport">Import</button>
        <button class="menu-action" id="btnExport">Export</button>
        <div class="menu-sep"></div>
        <button class="menu-action" id="btnClearDone">Clear the finished ones</button>
        <button class="menu-action danger" id="btnClearAll">Clear everything</button>
      </div>
    </div>


    <input type="file" id="importFile" accept="application/json,.json" hidden />

    <div class="cookie-banner" id="cookieBanner">
      <span>Cookies for traffic analytics. <a href="/privacy/">Learn more</a></span>
      <span class="cookie-actions">
        <button class="cookie-btn accept" onclick="acceptCookies()">Accept</button>
        <button class="cookie-btn" onclick="rejectCookies()">Decline</button>
      </span>
    </div>

    <script src="app.js"></script>
    <script>
      try {
        var c = localStorage.getItem("cookie-consent");
        if (!c) document.getElementById("cookieBanner").style.display = "flex";
        else if (c === "accepted") initGtag();
      } catch (e) {
        document.getElementById("cookieBanner").style.display = "flex";
      }
    </script>
  </body>
</html>
